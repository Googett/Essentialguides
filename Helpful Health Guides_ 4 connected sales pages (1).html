<style>
:root{--bg:#F7F4ED;--ink:#292D32;--btn:#B6533C;--gold:#C6A16A;--card:#fff;--mut:#5d636a;--sh:0 8px 24px rgba(41,45,50,.1)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:29px}h2{font-size:25px}h3{font-size:17px}p{margin:0 0 1em}img{max-width:100%;height:auto;display:block}a{color:inherit;text-decoration:none}
.w{max-width:1040px;margin:0 auto;padding:0 20px}.sec{padding:42px 0}.alt{background:#f0ebdf}.mut{color:var(--mut)}.sr{position:absolute;left:-9999px}
.eye{font:700 12px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9a7a45;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 34px;background:var(--btn);color:#fff;border:0;border-radius:999px;font:700 16px system-ui,sans-serif;letter-spacing:.08em;box-shadow:0 6px 16px rgba(182,83,60,.32);cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}.pulse{animation:z 2.5s ease-in-out infinite}@keyframes z{50%{transform:scale(1.035)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.ld .ring,.ld i{animation:none!important}}
.cta{text-align:center;padding-top:26px}.hero .cta{text-align:left;padding-top:8px}
.hero{display:grid;gap:26px;padding:30px 0 42px;align-items:center}.hook{font-style:italic;color:var(--mut)}.lead{font-size:18px}
.cover{width:min(250px,68%);margin:0 auto;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.pr{margin:6px 0 4px}.now{font:700 28px system-ui,sans-serif}.was{color:var(--mut);margin-left:8px;font:18px system-ui}.nt{font:12px system-ui;color:var(--mut)}
.grid{display:grid;gap:14px}.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--sh);border-top:3px solid var(--gold)}.card p{margin:0;color:var(--mut);font-size:16px}.num{font:700 13px system-ui;color:#9a7a45}
.pair{display:grid;gap:14px}.ph{border-radius:14px;box-shadow:var(--sh);background:#fff;width:100%}.cap{font:13px system-ui;color:var(--mut);margin-top:6px}
ul.ck{list-style:none;padding:0;margin:0;display:grid;gap:12px}ul.ck li{position:relative;padding-left:34px}ul.ck li:before{content:"✓";position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--btn);color:#fff;font:700 14px/24px system-ui;text-align:center}
.prod{display:grid;gap:22px;align-items:center;background:var(--card);padding:26px;border-radius:20px;box-shadow:var(--sh);border:1px solid var(--gold)}.dg{font:600 14px system-ui;color:#9a7a45}.fin{text-align:center}
details{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--sh)}summary{font:700 16px system-ui;cursor:pointer}details p{margin:10px 0 0;color:var(--mut)}
.mc{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;-webkit-overflow-scrolling:touch}
.pc{position:relative;flex:0 0 72%;scroll-snap-align:center;background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);border:1px solid rgba(198,161,106,.5);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.pc img{width:150px;border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.25)}.pc h3{margin:0;flex:1}.pc .btn{min-height:46px;padding:0 24px;font-size:14px;box-shadow:none}
.ld{position:absolute;inset:0;background:rgba(247,244,237,.82);border-radius:18px;display:grid;place-items:center}.ld svg{position:absolute;width:64px;height:64px;animation:r 1s linear infinite}.ring{fill:none;stroke:var(--btn);stroke-width:2;stroke-linecap:round;stroke-dasharray:40 125}
@keyframes r{to{transform:rotate(360deg)}}.ld b{display:flex;gap:4px}.ld i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:d 1.1s ease-in-out infinite}.ld i:nth-child(2){animation-delay:.1s}.ld i:nth-child(3){animation-delay:.2s}.ld i:nth-child(4){animation-delay:.3s}.ld i:nth-child(5){animation-delay:.4s}@keyframes d{50%{opacity:.25;transform:scale(.7)}}
footer{text-align:center;padding:26px 20px 30px;font:13px/1.5 system-ui;color:var(--mut)}.lk{background:none;border:0;color:var(--btn);font:700 13px system-ui;text-decoration:underline;padding:10px;cursor:pointer}
.stick{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,244,237,.97);border-top:1px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;transform:translateY(110%);transition:transform .25s}.stick.on{transform:none}.stick .btn{width:100%;max-width:420px;min-height:50px}.stick[hidden]{display:none}
.gate{max-width:520px;padding-top:44px;padding-bottom:40px}#q{width:100%;min-height:52px;padding:0 16px;border:1px solid var(--gold);border-radius:12px;font:17px system-ui;background:#fff;color:var(--ink)}
#lb{list-style:none;margin:10px 0 18px;padding:0;max-height:46vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:var(--sh)}#lb li{padding:14px 16px;border-bottom:1px solid #eee;font:16px system-ui;cursor:pointer;display:flex;gap:8px;align-items:center}#lb li small{margin-left:auto;color:var(--mut)}#lb li[aria-selected=true]{background:#f3e3dd;font-weight:700}
.gate .btn{width:100%}
@media(min-width:760px){h1{font-size:40px}h2{font-size:32px}.hero{grid-template-columns:1.2fr .8fr}.cover{width:290px}.grid.c3{grid-template-columns:repeat(3,1fr)}.pair{grid-template-columns:repeat(2,1fr)}.prod{grid-template-columns:260px 1fr}.mc{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}.pc{flex:none}.stick{display:none}}
